name: Campaign Center Neon preflight
on:
  pull_request:
    paths:
      - 'campaign-center-neon/**'
      - '.github/workflows/campaign-center-neon.yml'
  push:
    branches:
      - prep/neon-render-campaign-center-20261014
      - feature/campaign-team-connect-20261015
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campaign_qa
          POSTGRES_PASSWORD: only_local_ci_password
          POSTGRES_DB: campaign_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaign_qa -d campaign_qa"
          --health-interval 4s
          --health-timeout 4s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://campaign_qa:only_local_ci_password@127.0.0.1:5432/campaign_qa
    permissions:
      contents: read
    defaults:
      run:
        working-directory: campaign-center-neon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Multi-member campaign team and Connect end-to-end test on disposable Postgres
        run: node --test tests/team-connect.test.mjs
      - name: Six-tier plan catalogue and immutable scope
        run: node --test tests/six-plans.test.mjs
      - name: Campaign goal permissions, limits and immutable history
        run: node --test tests/goals.test.mjs
      - name: Source-grounded daily campaign Focus
        run: node --test tests/focus-board.test.mjs
      - name: Chesed Quick daily facts, cross-tenant and team privacy, immutable 7-day memory
        run: node --test tests/quick-daily.test.mjs
      - name: External donation URL audit, tenant and gateway honesty
        run: node --test tests/donation-links.test.mjs
      - name: Askan Plus member and team privacy, audited hand-offs
        run: node --test tests/askan-plus.test.mjs
      - name: Askan Plus accurate cash/check installments and receipt immutability
        run: node --test tests/plus-pledges.test.mjs
      - name: Askan Pro CRM privacy, append-only relationship history, followups and two-team permissions
        run: node --test tests/askan-pro-crm.test.mjs
      - name: Askan Pro true binary campaign files, per-member private and team scope
        run: node --test tests/pro-files.test.mjs
      - name: Askan Pro seven-day personal Sprints and immutable 30-day activity
        run: node --test tests/pro-sprints.test.mjs
      - name: Askan Pro private Guidance inbox and manager-message security
        run: node --test tests/pro-guidance.test.mjs
      - name: Askan Pro blocker privacy, audited resolution and no fabricated insights
        run: node --test tests/pro-blockers.test.mjs
      - name: Gabbai Pro maker-checker permissions and immutable approvals
        run: node --test tests/gabbai-approvals.test.mjs
      - name: Organization owner-only multi-campaign currency-safe portfolio
        run: node --test tests/organization-portfolio.test.mjs
      - name: Organization capped resources, months, concurrency and private audit
        run: node --test tests/organization-resources.test.mjs
      - name: Organization private append-only knowledge, revisions and review dates
        run: node --test tests/organization-memory.test.mjs
      - name: Custom Focus rule-scoring privacy, DNC and immutable config
        run: node --test tests/custom-focus.test.mjs
      - name: Six-tier server plan grants, quota gates, tenant isolation and immutable audit
        run: node --test tests/server-plan-entitlements.test.mjs
