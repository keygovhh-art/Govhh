openapi: 3.1.0
info:
  title: Gavhah Connect — Campaign Center / Olam Hachesed MAX (staged contract)
  version: 0.1.0-staging
  description: |
    Design contract only: these URLs are NOT yet active endpoints.
    All reads require an authenticated account and server-side active membership.
    Personal MAX private contacts/notes never appear here absent explicit sharing.
servers:
  - url: https://CONNECT-API-NOT-CONFIGURED.invalid
    description: Placeholder, not a working server.
security:
  - bearerAuth: []
paths:
  /v1/me/campaign-memberships:
    get:
      summary: List authenticated member's active campaign memberships
      responses:
        '200':
          description: Member-scoped list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
        '401': {description: Not authenticated}
  /v1/campaigns/{campaignId}/my-assignments:
    get:
      summary: Member's own tasks, call leads and follow-ups for this campaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Only active member's own assigned campaign work
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Assignment'}
        '403': {description: No verified active membership or scope}
  /v1/campaigns/{campaignId}/members/{memberId}/progress:
    get:
      summary: Permitted progress for the given member, not private personal notes
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - in: path
          name: memberId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Role-scoped member progress}
        '403': {description: Insufficient membership role or scope}
  /v1/campaigns/{campaignId}/shared-followups:
    post:
      summary: Create/link one authorized shared follow-up ID; never sync copied record bodies
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxFollowupRef, memberId, visibility]
              properties:
                maxFollowupRef: {type: string}
                memberId: {type: string, format: uuid}
                visibility: {type: string, enum: [campaign, assigned_managers]}
      responses:
        '201': {description: Link created; same MAX follow-up remains authoritative}
        '200': {description: Idempotent repeat of the same link}
        '403': {description: Sharing not authorized by user/campaign}
  /v1/campaigns/{campaignId}/finance-events:
    post:
      summary: Reconcile authorized event with unique source key and finance permissions
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinanceEvent'}
      responses:
        '201': {description: Audited finance event created}
        '200': {description: Same source event already present, not double-counted}
        '403': {description: Insufficient finance permission}
        '409': {description: Same request key with conflicting payload}
  /v1/organizations/{organizationId}/sponsored-max-seats:
    get:
      summary: Organization owner/manager lists active funded member slots
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': {description: Authorized seat entitlements}
        '403': {description: Insufficient role}
    post:
      summary: Assign/revoke member's sponsored MAX license; does not own private data
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Seat status updated without erasing private MAX data}
        '403': {description: Only authorized organization manager}
  /v1/campaigns/{campaignId}/live-rooms:
    get:
      summary: Return virtual campaign hall sessions and user-visible announcement state
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200': {description: Campaign-scoped rooms}
        '403': {description: Not a member}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verifiable short-lived server trusted token, not a browser-stored service secret.
  parameters:
    CampaignId:
      in: path
      name: campaignId
      required: true
      schema: {type: string, format: uuid}
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 12, maxLength: 128}
  schemas:
    Membership:
      type: object
      additionalProperties: false
      required: [organizationId, memberId, role, status]
      properties:
        organizationId: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        role: {type: string, enum: [owner, manager, squad_leader, askan, finance, auditor]}
        status: {type: string, enum: [invited, active, suspended, revoked]}
        sponsoredMaxAccess: {type: boolean}
    Assignment:
      type: object
      additionalProperties: false
      required: [id, campaignId, title, kind, status]
      properties:
        id: {type: string, format: uuid}
        campaignId: {type: string, format: uuid}
        title: {type: string}
        kind: {type: string, enum: [task, call_lead, followup, review]}
        status: {type: string, enum: [open, in_progress, done, cancelled]}
        dueAt: {type: [string, 'null'], format: date-time}
    FinanceEvent:
      type: object
      additionalProperties: false
      required: [sourceSystem, sourceEventKey, kind, amount, currency]
      properties:
        sourceSystem: {type: string, enum: [gavhah_max, campaign_center, verified_processor]}
        sourceEventKey: {type: string}
        kind: {type: string, enum: [pledge, receipt, refund, correction]}
        amount:
          type: string
          pattern: '^[0-9]+\\.[0-9]{2}$'
          description: Decimal string, not an imprecise JSON float
        currency: {type: string, enum: [USD]}
        pledgeRef: {type: [string, 'null'], format: uuid}
        paymentVerification: {type: string, enum: [manually_reported, processor_verified]}
