name: Campaign Center Neon preflight
on:
  pull_request:
    paths:
      - 'campaign-center-neon/**'
      - '.github/workflows/campaign-center-neon.yml'
  push:
    branches:
      - prep/neon-render-campaign-center-20261014
      - feature/campaign-team-connect-20261015
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campaign_qa
          POSTGRES_PASSWORD: only_local_ci_password
          POSTGRES_DB: campaign_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaign_qa -d campaign_qa"
          --health-interval 4s
          --health-timeout 4s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://campaign_qa:only_local_ci_password@127.0.0.1:5432/campaign_qa
    permissions:
      contents: read
    defaults:
      run:
        working-directory: campaign-center-neon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Multi-member campaign team and Connect end-to-end test on disposable Postgres
        run: node --test tests/team-connect.test.mjs
      - name: Six-tier plan catalogue and immutable scope
        run: node --test tests/six-plans.test.mjs
      - name: Campaign goal permissions, limits and immutable history
        run: node --test tests/goals.test.mjs
      - name: Source-grounded daily campaign Focus
        run: node --test tests/focus-board.test.mjs
      - name: External donation URL audit, tenant and gateway honesty
        run: node --test tests/donation-links.test.mjs
      - name: Askan Plus member and team privacy, audited hand-offs
        run: node --test tests/askan-plus.test.mjs
